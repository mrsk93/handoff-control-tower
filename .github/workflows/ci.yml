name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: app
          POSTGRES_DB: handoff_control_tower_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd="pg_isready -U postgres -d handoff_control_tower_test"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
      redis:
        image: redis:7
        ports: ["6379:6379"]
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
    env:
      APP_ENV: test
      DATABASE_URL: postgresql://postgres:app@127.0.0.1:5432/handoff_control_tower_test
      TEST_DATABASE_URL: postgresql://postgres:app@127.0.0.1:5432/handoff_control_tower_test
      REDIS_URL: redis://127.0.0.1:6379
      ADAPTER_MODE: mock
      ENABLE_DEMO_SIMULATOR: false
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - run: pnpm test:integration
      - run: pnpm security:scan
      - run: pnpm audit --audit-level=high
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
